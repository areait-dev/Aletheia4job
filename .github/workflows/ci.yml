name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Segnaposto: prisma.config.ts richiede DATABASE_URL, ma "prisma generate" e i
    # test (che mockano il DB) non si collegano mai a un database.
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/ci
      DIRECT_URL: postgresql://user:pass@localhost:5432/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
