name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Segnaposto: prisma.config.ts richiede DATABASE_URL, ma "prisma generate" e i
    # test (che mockano il DB) non si collegano mai a un database.
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/ci
      DIRECT_URL: postgresql://user:pass@localhost:5432/ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
